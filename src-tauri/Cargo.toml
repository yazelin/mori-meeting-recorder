[package]
name = "mori-meeting-recorder"
version = "0.1.0"
edition = "2021"
description = "Standalone dual-track meeting recorder for the Mori universe (Observer Mode MVP)"
# 兩個 bin(app + mori-whisper-serve supervisor)→ `cargo run`(tauri dev 用)要指定預設,否則 ambiguous。
default-run = "mori-meeting-recorder"

[[bin]]
name = "mori-meeting-recorder"
path = "src/main.rs"

[lib]
name = "mori_meeting_recorder"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
hound = "3.5"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
# 純 Rust OpenCC(bundle 官方字典)— 簡→台灣正體,品質對齊 OpenCC,零外部安裝。
ferrous-opencc = "0.4"
# 共享 whisper-server 的 HTTP client(localhost)+ 摘要 cloud-first 的 Groq HTTPS。
# tls feature 走 rustls(純 Rust,無系統 OpenSSL,對齊 standalone-first / bundle-in-repo)。
ureq = { version = "2", default-features = false, features = ["tls"] }
# 摘要送 LLM 前 redact 長壽憑證(鏡射 mori-core redact.rs 的 regex pattern)。
regex = "1"
# 講者分離(onnx,無 Python)。static = 靜態連 onnxruntime(CPU)。GPU 之後用 provider=cuda(需 CUDA-enabled build)。
sherpa-onnx = { version = "1.13", default-features = false, features = ["static"] }

# Linux:libpulse client API(PipeWire 完全相容,看得到 .monitor source)
[target.'cfg(target_os = "linux")'.dependencies]
libpulse-binding = "2"
libpulse-simple-binding = "2"
# whisper-serve supervisor 用 PR_SET_PDEATHSIG(supervisor 被殺時連帶收掉 whisper-server child)
libc = "0.2"

# Windows:cpal WASAPI loopback(對齊 mori-desktop)
[target.'cfg(target_os = "windows")'.dependencies]
cpal = "0.15"

[dev-dependencies]
tempfile = "3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
